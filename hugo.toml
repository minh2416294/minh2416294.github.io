baseURL = "https://minh2416294.github.io/"
locale = "en-us"
title = "Minh's Blog"
theme = "PaperMod"

enableRobotsTXT = true
buildDrafts = false
buildFuture = false
buildExpired = false
pygmentsUseClasses = true

[pagination]
  pagerSize = 10

[minify]
  disableXML = true
  minifyOutput = true

[markup]
  [markup.highlight]
    noClasses = false
    style = "github"
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[outputs]
  home = ["HTML", "RSS", "JSON"]

# Tags page removed: an empty taxonomies table disables Hugo's default
# `tag`/`category` taxonomies, so /tags/ and /tags/<term>/ are not generated.
[taxonomies]

[params]
  env = "production"
  description = "Computer science student learning about Agentic AI."
  author = "Tran Binh Minh"
  images = ["images/og-default.png"]
  defaultTheme = "auto"
  disableThemeToggle = false
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = false
  ShowCodeCopyButtons = true
  ShowWordCount = false
  ShowToc = false
  comments = false

  [params.profileMode]
    enabled = false

  [params.contact]
    github = "https://github.com/minh2416294"
    discord = "https://discord.com/users/1477770162491887809"
    whatsapp = "https://wa.me/84396065999"
    email = "mailto:minh2416294@gmail.com"

  [params.fuseOpts]
    isCaseSensitive = false
    shouldSort = true
    location = 0
    distance = 1000
    threshold = 0.4
    minMatchCharLength = 0
    limit = 10
    keys = ["title", "permalink", "summary", "content"]

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/minh2416294"
  [[params.socialIcons]]
    name = "email"
    url = "mailto:minh2416294@gmail.com"

[[menu.main]]
  identifier = "posts"
  name = "Posts"
  url = "/posts/"
  weight = 10
[[menu.main]]
  identifier = "projects"
  name = "Projects"
  url = "/projects/"
  weight = 20
[[menu.main]]
  identifier = "contributions"
  name = "Contributions"
  url = "/contributions/"
  weight = 30
[[menu.main]]
  identifier = "search"
  name = "Search"
  url = "/search/"
  weight = 50
