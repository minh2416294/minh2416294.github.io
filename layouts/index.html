{{- /* Homepage is a redirect to /posts/ — the real content lives at the
       Posts section page. Standalone document (no theme baseof), so there is
       no chrome flash before the redirect. */ -}}
{{- $target := "/posts/" | relLangURL -}}
<!DOCTYPE html>
<html lang="{{ site.Language.Lang | default "en" }}">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex, follow">
  <meta http-equiv="refresh" content="0; url={{ $target }}">
  <link rel="canonical" href="{{ "/posts/" | absLangURL }}">
  <title>{{ site.Title }}</title>
  <script>window.location.replace({{ $target }});</script>
</head>
<body>
  <p>Redirecting to <a href="{{ $target }}">Posts</a>&hellip;</p>
</body>
</html>
